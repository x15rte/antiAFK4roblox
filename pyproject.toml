[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antiAFK4roblox"
dynamic = ["version"]
description = "Windows Tkinter utility that sends periodic anti-AFK key input to Roblox."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "x15rte" }]
dependencies = ["pywin32==312"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]

[project.gui-scripts]
antiAFK4roblox = "app:main"

[tool.setuptools]
py-modules = ["anti_afk", "app", "main"]

[tool.setuptools.dynamic]
version = { attr = "app.APP_VERSION" }
