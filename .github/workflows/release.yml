name: Build and Release EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version from app.py
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Path app.py -Raw
          $match = [regex]::Match($content, '(?m)^APP_VERSION\s*=\s*["'']([^"'']+)["'']')
          if (-not $match.Success) { throw "APP_VERSION not found in app.py" }
          $version = $match.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name antiAFK4roblox --hidden-import=win32com.client main.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/antiAFK4roblox.exe -DestinationPath dist/antiAFK4roblox-${{ steps.version.outputs.tag }}-windows.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/antiAFK4roblox-${{ steps.version.outputs.tag }}-windows.zip
